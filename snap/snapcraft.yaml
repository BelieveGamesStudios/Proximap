name: proximap
base: core24
version: '1.4.0'
summary: 3D Scene Reconstruction & Photogrammetry Desktop Dashboard
description: |
  Proximap is an intuitive, high-performance desktop application for photogrammetry 
  and 3D point cloud reconstruction. Automates COLMAP and OpenMVS pipelines for 
  transforming 2D images and standalone point clouds into textured 3D meshes.

icon: public/app_icon.png
grade: devel
confinement: classic

lint:
  ignore:
    - library

platforms:
  amd64:

apps:
  proximap:
    command: Proximap
    environment:
      LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu:/var/lib/snapd/lib/gl:$SNAP/usr/lib/x86_64-linux-gnu:$SNAP/usr/lib/x86_64-linux-gnu/dri:$SNAP/lib/x86_64-linux-gnu:$SNAP/_internal:$LD_LIBRARY_PATH
      LIBGL_DRIVERS_PATH: /var/lib/snapd/lib/gl/dri:$SNAP/usr/lib/x86_64-linux-gnu/dri
      __EGL_VENDOR_LIBRARY_DIRS: /var/lib/snapd/lib/gl/glvnd/egl_vendor.d:$SNAP/usr/share/glvnd/egl_vendor.d
      XCB_CURSOR_LIBRARY: $SNAP/usr/lib/x86_64-linux-gnu/libxcb-cursor.so.0
      QT_QPA_PLATFORM: xcb
    desktop: usr/share/applications/proximap.desktop
    plugs:
      - home
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - opengl
      - removable-media

parts:
  proximap:
    plugin: dump
    source: dist/Proximap
    source-type: local
    stage-packages:
      - libgl1
      - libglx0
      - libopengl0
      - libegl1
      - libgl1-mesa-dri
      - libx11-6
      - libxext6
      - libxrender1
      - libxrandr2
      - libxcursor1
      - libxinerama1
      - libxi6
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libfontconfig1
      - libdbus-1-3
      - libxcb-cursor0
      - libxcb1
      - libxcb-glx0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-shm0
      - libxcb-sync1
      - libxcb-util1
      - libxcb-xfixes0
      - libxcb-xkb1
      - libglu1-mesa
      - libgomp1
      - libmuparser2v5
      - libtbb12
      - libxerces-c3.2t64
    override-build: |
      craftctl default
      mkdir -p "$CRAFT_PART_INSTALL/usr/share/applications"
      mkdir -p "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps"
      mkdir -p "$CRAFT_PART_INSTALL/meta/gui"
      if [ -f "$CRAFT_PART_INSTALL/public/app_icon.png" ]; then
        cp "$CRAFT_PART_INSTALL/public/app_icon.png" "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/proximap.png"
        cp "$CRAFT_PART_INSTALL/public/app_icon.png" "$CRAFT_PART_INSTALL/meta/gui/proximap.png"
        cp "$CRAFT_PART_INSTALL/public/app_icon.png" "$CRAFT_PART_INSTALL/meta/gui/icon.png"
      fi
      cat <<EOF > "$CRAFT_PART_INSTALL/usr/share/applications/proximap.desktop"
      [Desktop Entry]
      Name=Proximap
      Comment=3D Scene Reconstruction & Photogrammetry Desktop Dashboard
      Exec=proximap
      Icon=proximap
      Terminal=false
      Type=Application
      Categories=Graphics;3DGraphics;Science;
      EOF
