name: proximap
base: core24
version: '1.4.0'
summary: 3D Scene Reconstruction & Photogrammetry Desktop Dashboard
description: |
  Proximap is an intuitive, high-performance desktop application for photogrammetry 
  and 3D point cloud reconstruction. Automates COLMAP and OpenMVS pipelines for 
  transforming 2D images and standalone point clouds into textured 3D meshes.

icon: public/app_icon.png
grade: devel
confinement: classic

lint:
  ignore:
    - library

platforms:
  amd64:

apps:
  proximap:
    command: Proximap
    environment:
      LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu:/var/lib/snapd/lib/gl:$SNAP/usr/lib/x86_64-linux-gnu:$SNAP/usr/lib/x86_64-linux-gnu/dri:$SNAP/lib/x86_64-linux-gnu:$SNAP/_internal:$LD_LIBRARY_PATH
      LIBGL_DRIVERS_PATH: /var/lib/snapd/lib/gl/dri:$SNAP/usr/lib/x86_64-linux-gnu/dri
      __EGL_VENDOR_LIBRARY_DIRS: /var/lib/snapd/lib/gl/glvnd/egl_vendor.d:$SNAP/usr/share/glvnd/egl_vendor.d
      XCB_CURSOR_LIBRARY: $SNAP/usr/lib/x86_64-linux-gnu/libxcb-cursor.so.0
      QT_QPA_PLATFORM: xcb
    desktop: usr/share/applications/proximap.desktop
    plugs:
      - home
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - opengl
      - removable-media

parts:
  proximap:
    plugin: nil
    source: .
    source-type: local
    stage-packages:
      - libgl1
      - libglx0
      - libopengl0
      - libegl1
      - libgl1-mesa-dri
      - libx11-6
      - libxext6
      - libxrender1
      - libxrandr2
      - libxcursor1
      - libxinerama1
      - libxi6
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libfontconfig1
      - libdbus-1-3
      - libxcb-cursor0
      - libxcb1
      - libxcb-glx0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-shm0
      - libxcb-sync1
      - libxcb-util1
      - libxcb-xfixes0
      - libxcb-xkb1
    override-pull: |
      craftctl default
      # Remove temporary build artifacts from source copy while preserving backend_bin
      rm -rf venv *.snap __pycache__ .git build dist parts stage prime
    override-build: |
      set -e

      # Ensure APT bypasses mirror sync glitches
      apt-get update -o Acquire::http::No-Cache=true -o Acquire::BrokenProxy=true --fix-missing || true
      apt-get install -y --no-install-recommends \
        python3 python3-pip python3-venv python3-dev \
        gcc g++ make gfortran \
        libgl1-mesa-dev libegl1-mesa-dev libglib2.0-dev libfontconfig1-dev \
        libx11-dev libxext-dev libxrender-dev libxrandr-dev libxcursor-dev \
        libxinerama-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libdbus-1-dev libopenblas-dev \
        libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
        libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
        libxcb-xfixes0 libxcb-xkb1 libxcb-glx0 libxcb1 libx11-xcb1 libxkbcommon-x11-0

      # Install Python dependencies inside the container (with retry for slow PyPI)
      pip3 install --break-system-packages --timeout 300 --retries 5 -r requirements.txt

      # Run PyInstaller to build the frozen executable
      python3 -m PyInstaller Proximap.spec --noconfirm

      # Bundle xcb system libs into _internal so PyInstaller bootloader finds them
      INTERNAL="dist/Proximap/_internal"
      for lib in \
        /usr/lib/x86_64-linux-gnu/libxcb-cursor.so.0* \
        /usr/lib/x86_64-linux-gnu/libxcb-icccm.so.4* \
        /usr/lib/x86_64-linux-gnu/libxcb-image.so.0* \
        /usr/lib/x86_64-linux-gnu/libxcb-keysyms.so.1* \
        /usr/lib/x86_64-linux-gnu/libxcb-randr.so.0* \
        /usr/lib/x86_64-linux-gnu/libxcb-render-util.so.0* \
        /usr/lib/x86_64-linux-gnu/libxcb-shape.so.0* \
        /usr/lib/x86_64-linux-gnu/libxcb-shm.so.0* \
        /usr/lib/x86_64-linux-gnu/libxcb-sync.so.1* \
        /usr/lib/x86_64-linux-gnu/libxcb-util.so.1* \
        /usr/lib/x86_64-linux-gnu/libxcb-xfixes.so.0* \
        /usr/lib/x86_64-linux-gnu/libxcb-xkb.so.1* \
        /usr/lib/x86_64-linux-gnu/libxcb-glx.so.0* \
        /usr/lib/x86_64-linux-gnu/libxcb.so.1* \
        /usr/lib/x86_64-linux-gnu/libX11-xcb.so.1* \
        /usr/lib/x86_64-linux-gnu/libxkbcommon-x11.so.0*; do
        [ -f "$lib" ] && cp -n "$lib" "$INTERNAL/" || true
      done

      # Copy PyInstaller output to snap install directory
      mkdir -p "$CRAFT_PART_INSTALL"
      cp -r dist/Proximap/* "$CRAFT_PART_INSTALL/"

      # Create desktop entry and icon
      mkdir -p "$CRAFT_PART_INSTALL/usr/share/applications"
      mkdir -p "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps"
      mkdir -p "$CRAFT_PART_INSTALL/meta/gui"
      if [ -f "$CRAFT_PART_INSTALL/public/app_icon.png" ]; then
        cp "$CRAFT_PART_INSTALL/public/app_icon.png" \
           "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/proximap.png"
        cp "$CRAFT_PART_INSTALL/public/app_icon.png" \
           "$CRAFT_PART_INSTALL/meta/gui/proximap.png"
        cp "$CRAFT_PART_INSTALL/public/app_icon.png" \
           "$CRAFT_PART_INSTALL/meta/gui/icon.png"
      fi
      printf '[Desktop Entry]\nName=Proximap\nComment=Intuitive desktop 3D photogrammetry app.\nExec=proximap\nIcon=proximap\nTerminal=false\nType=Application\nCategories=Graphics;3DGraphics;Science;\n' > "$CRAFT_PART_INSTALL/usr/share/applications/proximap.desktop"
